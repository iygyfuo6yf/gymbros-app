services:
  - type: web
    name: gymbros-api
    env: docker
    rootDir: apps/api
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        sync: false
