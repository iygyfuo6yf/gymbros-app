version: '3.9'
services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: file:/data/prod.db
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      APPLE_SERVICE_ID: ${APPLE_SERVICE_ID}
      SOCIAL_TOKEN_VALIDATION_MODE: strict
    ports:
      - '4000:4000'
    volumes:
      - api-data:/data

volumes:
  api-data:
